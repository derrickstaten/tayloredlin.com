<!doctype html>
<!-- Source for images/og.png (the link preview). Re-render with tools/render-og.sh. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Inter:wght@600&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;color:var(--on-dark);background:radial-gradient(ellipse 60% 80% at 80% 0%,rgba(255,231,190,.14),transparent 70%),var(--ink);padding:84px 96px 0;box-sizing:border-box}
  .card .eyebrow{font-size:18px;margin-bottom:26px}
  .card h1{font:500 92px/1.02 var(--serif)}
  .card h1 em{display:block;color:var(--brass);font-weight:400}
  .card p.sub{font:italic 400 30px/1.4 var(--serif);color:var(--on-dark-muted);margin:30px 0 0}
  .card .keys{position:absolute;left:0;right:0;bottom:0;height:72px;background-size:183px 72px}
</style></head>
<body><div class="card">
  <p class="eyebrow">tayloredlin.com</p>
  <h1>Voice &amp; Piano Lessons <em>with Taylor Edlin</em></h1>
  <p class="sub">Learn from a performer. Find your own sound.</p>
  <div class="keys"></div>
</div></body></html>
